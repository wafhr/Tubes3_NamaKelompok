<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Judol Detector</title>
    <link rel="stylesheet" href="judol.css" />
  </head>
  <body>
    <main class="judol-popup">
      <header class="judol-popup-header">
        <div>
          <h1>Judol Detector</h1>
        </div>
      </header>

      <p id="search-meta" class="judol-search-meta">Belum ada scan</p>

      <section class="judol-popup-actions" aria-label="Aksi scan">
        <label class="judol-power-switch" aria-label="Deteksi aktif">
          <input id="enabled-toggle" type="checkbox" />
          <span class="judol-switch-track" aria-hidden="true">
            <span class="judol-switch-thumb"></span>
          </span>
          <span id="enabled-toggle-label" class="judol-switch-label">Off</span>
        </label>
        <button id="rescan-button" class="judol-icon-button" type="button" title="Rescan" aria-label="Rescan">
          <svg class="judol-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 12a8 8 0 0 1-13.66 5.66" />
            <path d="M4 12A8 8 0 0 1 17.66 6.34" />
            <path d="M17 2v5h-5" />
            <path d="M7 22v-5h5" />
          </svg>
        </button>
      </section>

      <section class="judol-popup-summary" aria-label="Ringkasan scan">
        <div>
          <span>Total Keyword</span>
          <strong id="total-keywords">0</strong>
        </div>
        <div>
          <span>Total Match</span>
          <strong id="total-matches">0</strong>
        </div>
      </section>

      <section class="judol-popup-section">
        <h2>Keyword</h2>
        <div id="keyword-chart" class="judol-bar-chart"></div>
      </section>

      <section class="judol-popup-section">
        <h2>Algoritma</h2>
        <table class="judol-stats-table">
          <thead>
            <tr>
              <th>Algoritma</th>
              <th>Match</th>
              <th>Waktu</th>
              <th>Perbandingan</th>
            </tr>
          </thead>
          <tbody id="algorithm-table"></tbody>
        </table>
      </section>

      <section class="judol-popup-section">
        <h2>Kontrol</h2>
        <label class="judol-toggle">
          <span>Blur teks terdeteksi</span>
          <input id="blur-toggle" type="checkbox" />
        </label>
        <label class="judol-toggle">
          <span>Aho-Corasick</span>
          <input id="aho-toggle" type="checkbox" />
        </label>
        <label class="judol-toggle">
          <span>Rabin-Karp</span>
          <input id="rabin-toggle" type="checkbox" />
        </label>
        <label class="judol-toggle">
          <span>OCR gambar</span>
          <input id="ocr-toggle" type="checkbox" />
        </label>
      </section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
